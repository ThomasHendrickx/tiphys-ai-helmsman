# The gate registry: the only gate list (DR-0061, M6-P3). CI runs
#   node bin/tiphys.ts gates run --registry gate-registry.yaml --mode full
#     --event <pull_request|push> --evidence <dir> --base <sha> --head <sha>
# on each event (plus --phase on a pull request); `--event` selects the gates
# whose `events` name it. Every gate names the failure it `prevents` and runs
# on code, a built artefact or git state (DR-0061 (b)).
#
# `applicability: conditional` marks a gate whose precondition is legitimately
# unmet in a normal run (a non-phase branch, a diff touching no code, a change
# with no review evidence yet); the runner fails the run on a `required` gate
# that is red, vacuous, errors or is not applicable.
kind: gate-registry
version: 1

preflight:
  - command: [npm, ci]
    note: install exactly the lockfile, npm only, never pnpm or yarn
  - command: [npm, run, build]
    note: the type gate (tsc -b); emits dist/, which is never committed, and git status must be clean afterwards
  - command: [npm, test]
    note: build first, or the tests that exercise the built CLI skip

gates:
  - id: authored-bytes
    prevents: a control or non-ASCII byte in a tracked authored file, which turns a source file into binary no diff can review (T-010)
    command: [node, scripts/check-authored-bytes.mjs]
    unitLabel: tracked files checked
    applicability: required
    verified-by: script
    modes: [full, direct-pr, local-only]
    events: [pull_request, push]

  - id: credential-scrub
    prevents: an executor child process inheriting a credential that can open or merge a pull request
    command: [node, src/gates/credentials.ts, credential-scrub]
    unitLabel: credential sources probed
    applicability: required
    verified-by: script
    modes: [full, direct-pr, local-only]
    events: [pull_request, push]

  - id: suite
    prevents: a change that breaks a test, or a registered behavior whose test no longer runs
    command: [node, src/gates/suite.ts, --pin-root, src, --pin-root, bin, --pin-root, test]
    unitLabel: tests reported
    applicability: required
    verified-by: script
    modes: [full, direct-pr, local-only]
    events: [pull_request, push]
    parameters: [base]

  - id: typecheck
    prevents: a type error in src/, test/ or plugin/
    # --force, so the unit count (the files tsc lists) does not depend on dist/.
    command: [node, src/gates/gate-classes.ts, typecheck, --project, tsconfig.src.json, --project, tsconfig.test.json, --project, plugin/tsconfig.json]
    unitLabel: source files type-checked
    applicability: required
    verified-by: script
    modes: [full, direct-pr, local-only]
    events: [pull_request, push]

  - id: license
    prevents: a production dependency with a missing or non-allowlisted license in the shipped package
    command: [node, scripts/license-gate.mjs]
    unitLabel: production packages licensed
    applicability: required
    verified-by: script
    modes: [full, direct-pr, local-only]
    events: [pull_request, push]

  - id: scope
    prevents: a phase branch changing a file outside its phase declaration
    command: [node, src/gates/scope.ts, --declarations, delivery/plan/phase-declarations]
    unitLabel: changed paths audited
    applicability: conditional
    verified-by: script
    modes: [full, direct-pr]
    events: [pull_request]
    parameters: [base, head]
    precondition:
      id: scope-branch-is-a-phase-branch
      kind: branch-matches
      pattern: claude/m[0-9]+-p[0-9]+-.*

  - id: red-witness
    prevents: a src/, bin/ or plugin/ change whose tests stay green when the change is mutated away
    # `event` (M6-P8, DR-0066): on a pull request the gate evaluates the
    # pull request's own witness specs and a stored spec only when the diff
    # changes a file it mutates or a test file it runs, and counts the rest as
    # skipped; on push, and on a run naming no event, it evaluates every
    # stored spec. The push run on `main` is where the full sweep now happens.
    command: [node, src/gates/red-witness.ts]
    unitLabel: witnesses evaluated
    applicability: conditional
    verified-by: script
    modes: [full, direct-pr]
    events: [pull_request, push]
    parameters: [base, head, event]
    precondition:
      id: red-witness-diff
      kind: diff-touches
      paths:
        - src/
        - bin/
        - plugin/

  - id: merge-preconditions
    prevents: a merge without the reviews its tier owes, or without green CI on the merged head
    # Reads its GitHub API token from the variable it is told to (the
    # pull-request step sets GH_TOKEN), and reports error, never green, when it
    # cannot reach the API.
    command: [node, src/gates/merge-preconditions.ts, --token-env, GH_TOKEN]
    unitLabel: merge preconditions evaluated
    applicability: conditional
    verified-by: script
    modes: [full, direct-pr]
    events: [pull_request]
    parameters: [base, head, phase]
    precondition:
      id: merge-preconditions-review-budget-decidable
      kind: command-exit-zero
      command: [node, scripts/check-dual-review.mjs, --precondition, --review-budget, .]

# Commands and modules whose operations can destroy work. The red-witness gate
# derives a witness class from this list.
destructiveCommands:
  - pool destroy
  - teardown
  - src/pool.ts
  - src/teardown.ts
