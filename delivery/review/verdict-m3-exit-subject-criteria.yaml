      - "delivery/work-history/exit-subject-doctor-kernel-artifacts.md:143 shows the ONE deviation this work history declares (the resolver mechanism) is explicitly labelled a deviation; grep -n -i deviation over the same file returns only that one line, so the witness-filename substitution is never labelled a deviation anywhere"
      - "src/checks.ts:2383-2394 (verdictDeviationsJudged) compares a verdict's deviations-judged[] only against deviations the work history itself declares, so an undeclared deviation is structurally invisible to the one mechanical check built for this shape"
    concrete-fix: >-
      Either rename one of the four delivered witness specs to
      witness/doctor-kernel-artifacts.json so the plan's literal filename
      exists, or add an explicit declared deviation to
      delivery/work-history/exit-subject-doctor-kernel-artifacts.md naming
