      per-behavior-id shape (matching kernel-plan-m3.md:5233's own
      witness/<behavior-id>.json wording and the M3-P8 precedent the work
      history cites) serves the plan's intent, so a reviewer's verdict can
      record a real judgement on it rather than the judgement never being
      asked for.
    analysis: >-
      Reachability (DR-0027): does not reach doctor's runtime behaviour
      (witness specs are gate-time artifacts, never shipped in the npm
      package), but reaches the evidence bundle DR-0012's delegated merge
      authority and this exit test's own E2.1 authorization stage are defined
      against, and it evades the specific mechanical guard
      (verdict-deviations-judged) built to catch exactly this shape, by never
      surfacing as a declared deviation for that guard to compare against.
      The substitution itself may well be defensible (see the concrete-fix
      reasoning); the defect is that nobody was asked to judge it.
  - id: CR-002
    severity: medium
    evidence:
      - "delivery/evidence/m3-exit-test/e1/plan-kernel-artifacts.yaml:98-102: the witness step asks for at least two structurally different dangerousStates members, a removed DIRECTORY and a removed FILE"
      - "delivery/evidence/m3-exit-test/e1/plan-kernel-artifacts.yaml:141-143 (criterion 2) names AGENTS.md-absent the second structurally different member of the class"
      - "witness-records.json produced by `node dist/bin/tiphys.js gates run --registry gate-registry.yaml --mode full --only red-witness --evidence <dir> --base origin/main --head HEAD` (node v26.6.0, dist/ built), read directly: across all 7 evaluations' members[].runs[].failedNamedTests, the only test names that ever appear are the tests each spec's own tests[] names; neither 'a staged install missing roles/ is a FAIL naming roles/' (test/doctor.test.ts:95) nor 'a staged install missing AGENTS.md is caught, which is the FILE member of the class' (test/doctor.test.ts:102) appears in any witness's tests[] or in any failedNamedTests list"
      - "gate run output, same invocation: 'red-witness: green: 7 witness(es) evaluated (6 own, 1 stored re-evaluated in 23941ms); every witness red against every declared dangerous state and green at head' - independently reproduced, not the 6 own map onto: doctor-kernel-artifacts-empty-directory, -fifo, -resolution, -unresolvable, and the two modified retention specs, none of which names either of the two behaviours above"
      - "CLAUDE.md's top-level red-witness rule: 'a test only counts as guarding a behavior if it has been demonstrated red without the behavior and green with it'"
    concrete-fix: >-
      Add a fifth witness spec (a genuinely separate one is likely required,
      per the harness rule the work history itself records: every named test
      of a spec must redden under every declared member) whose
      dangerousStates member removes or defangs the ENOENT-arm missing.push
      calls for the directory loop and the entry.kind === "regular" branch
      for the file check, and names 'a staged install missing roles/ is a
      FAIL naming roles/' and 'a staged install missing AGENTS.md is caught,
      which is the FILE member of the class' in its tests[].
    analysis: >-
      Reachability (DR-0027): reaches shipped src/commands/doctor.ts directly
      (the plain-missing-directory and plain-missing-file arms are the
      check's entire reason to exist) and a real user path (any consumer of
      the published package running doctor --for full against a broken
      install). The currently shipped behaviour is correct and covered by
      ordinary node --test assertions, so this is a proof-obligation gap
      rather than a live defect, but a future edit to the shared
      try/catch/push logic could defeat exactly these two arms while leaving
      all four witnessed arms green, and no red-witness gate would notice.
      Severity calibrated against this repository's own recorded history with
      the identical shape (CLAUDE.md's account of M1-P6's two consecutive
      medium findings from "one witness is not a class").
