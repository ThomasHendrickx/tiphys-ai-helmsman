deviations-judged:
  - deviation: >-
      Amended under finding PR-1. The check resolves the install root as the
      directory containing the kernel's own package.json, computed from
      import.meta.url WITHOUT searching upward, and never through
      kernelRoot.
    serves-plan-intent: true
    reasoning: >-
      What PR-1 was protecting is preserved exactly: the search key is
      package.json (the package boundary) rather than roles/ (the artifact
      under test), so an install missing roles/ cannot be walked past, which
      is verified directly by criterion 9's test and my own manual
      reproduction with a decoy parent. The literal "without searching
      upward" wording is not followed to the letter (resolveInstalledKernelRoot
      DOES walk upward, but for package.json rather than for the artifact
      under test), but the measured reason (npm pack --dry-run puts the
      compiled module three levels below the package root while the
      development checkout puts it two levels below, so a fixed depth from
      import.meta.url is wrong in one of the two shipped layouts) is a real,
      checkable constraint the plan's literal wording did not anticipate,
      and the deviation is declared plainly rather than absorbed silently.
      Judged as serving the plan's intent.
