findings:
  - id: CR-001
    severity: medium
    evidence:
      - "delivery/evidence/m3-exit-test/e1/plan-kernel-artifacts.yaml:98-102 and :125 name exactly one witness spec file, witness/doctor-kernel-artifacts.json"
      - "delivery/evidence/m3-exit-test/e1/plan-kernel-artifacts.yaml:166-175 (acceptance criterion 7, added verbatim from finding PR-2's concrete-edit in delivery/evidence/m3-exit-test/e1/findings-plan-review.yaml) repeats the same filename"
