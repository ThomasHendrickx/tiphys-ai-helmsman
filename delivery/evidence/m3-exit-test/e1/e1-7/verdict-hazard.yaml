      on an uncaught error, asserted by a test that stages the unresolvable case.
    evidence:
      - "the unit arm is asserted at test/doctor.test.ts:712 and passes"
      - "through the CLI, dist/ copied to a directory with no package.json above it: exit 1 with 'tiphys: package.json not found above ...', so the letter holds; the exit comes from src/version.ts:20 and never from the check, which is CR-004"
    met: true
  - id: "11"
    quote: >-
      A FIFO placed at the AGENTS.md path of a staged install makes the check
      return FAIL naming the observed entry type in under five seconds, asserted
      with a timeout.
    evidence:
      - "forced through the built CLI under timeout 10: CHECK kernel-artifacts WARN ... is missing AGENTS.md (irregular: ... is a named pipe, not a regular file, so it was not opened), no hang"
      - "five further shapes also refused in bounded time: FIFO replacing roles/ (ENOTDIR), FIFO inside roles/, symlink to a FIFO, dangling symlink, symlink loop (ELOOP)"
