deviations-judged:
  - deviation: computed from import.meta.url WITHOUT searching upward
    serves-plan-intent: true
    reasoning: >-
      The finding PR-1 was protecting one property: the resolver must not search
      for the artifact under test. A fixed depth cannot satisfy both shipped
      layouts, and I measured that rather than accepting it: after npm ci and
      npm run build at the head, ls dist gives bin, node_modules, src and the
      tsbuildinfo with no dist/package.json, and doctor.js is at
      dist/src/commands/doctor.js while the checkout runs src/commands/doctor.ts.
      The delivered walk keys on package.json, which is the package boundary and
      not a member of the audited set, and I attacked it with the decoy-parent
      construction of criterion 9 through the CLI and could not make it answer
      about an ancestor. The deviation serves the intent and the wording did not.
hazard-classes-addressed:
  - class-id: H1
    probed: >-
      Attacked the vacuous pass beyond criterion 3's empty-directory instance,
      against a real staged install of the built package with gh stubbed and a
      remote configured so kernel-artifacts drove the exit code. Four shapes
      reported PASS: checklists/ carrying one unrelated file (while checklist
      resolve --checklist clean-room reported no checklist shipped, exit 1),
      roles/ carrying only an empty subdirectory, roles/ whose members were all
      truncated to zero bytes, and AGENTS.md present at zero bytes. Under the
      combined attack doctor --for full exited 0 with FAIL count zero while
      printing that the install carries all four artifacts. Controls run: a
      directory replaced by a file or a FIFO is reported as ENOTDIR, and
      AGENTS.md replaced by a directory is reported irregular, so the type
      checking is real and it is the CONTENT that is unchecked.
    finding: CR-001
  - class-id: H2
    probed: >-
      Every measurement in this review was made against a staged install copied
      out of the built tree, never against the development checkout, and the
      resolver was exercised through the built CLI from a fleet home rather than
      by calling the function. The delivered resolver keys on package.json and
      not on the artifact under test, so the PR-1 arm that would have made it
      report about an ancestor was attacked directly: a staged install without
      roles/ placed inside a parent carrying roles/implementer.md still reported
      FAIL naming roles/ with exit 1. The two layout claims the design rests on
      were re-measured rather than read (no dist/package.json; the module at
      dist/src/commands/doctor.js). The phase's own tests stage installs too
      rather than asserting against this checkout, with one exception that is
      correct: the promotion test asserts against the PROFILE TABLE because this
      checkout's install is complete.
    cleared-because: >-
      The check reports the resolved install and not the development checkout,
      demonstrated by execution against staged installs in four separate labs,
      including the decoy-ancestor construction that is the arm an upward-walking
      resolver reports PASS on.
  - class-id: H3
    probed: >-
      Ran the unpromoted arm through the CLI: the broken install with no --for
      printed WARN and exited 0, and it did so with a gh FAIL in the same output,
      which shows the profile table rather than the check deciding the exit code.
      Read the promotion table at src/commands/doctor.ts:62 and confirmed
      kernel-artifacts-incomplete appears under full and under no other profile,
      which the phase asserts against generic, local-only and direct-pr by name.
      Then attacked the asymmetry: the resolution-failure arm returns a bare FAIL
      with no condition, so it is profile-independent and would fail a local-only
      run. I could not reach that arm through the CLI at all, because the process
      refuses earlier in src/version.ts:20 with exit 1, so the wrong-direction
      promotion I was hunting for is unreachable; that is recorded as CR-004 for
      the claim rather than as an H3 finding for the behaviour.
    cleared-because: >-
      The promotion is in the declared direction and was witnessed in both
      directions through the CLI; the one profile-independent arm is unreachable
      from any command, so no missing artifact stops a local-only run.
  - class-id: H4
    probed: >-
      Compared the two edited M3-P8 specs' mutation text before and after to
      test for defanging rather than repair: the first changed from deleting
      retention-undeclared out of the full array to renaming it
      retention-undeclared-DEFANGED, which removes it from the array just as
      effectively, and the second re-quoted the same append against the
      reformatted array. The find text occurs exactly once in the file (grep -c
      = 1) so neither mutation is ambiguous. Checked each of the four new specs
      for two structurally different members and confirmed they differ in kind
      rather than in wording. Then ran the gate at the review head rather than
      trusting the table: red-witness green, 7 witnesses (6 own, 1 stored
      re-evaluated), runner exit 0, and the produced witness-records.json shows
      per-member runs with exitCode 1 red at both repetitions and exitCode 0
      green at head, with the guarding test named in failedNamedTests.
    cleared-because: >-
      Every witness reddens under both of its structurally different members at
      two repetitions and is green at head, measured from the produced
      witness-records.json rather than from a bundle-level green, and the two
      stored specs this change edits were repaired rather than weakened.
  - class-id: H5
    probed: >-
      Six constructions against a real staged install, each under timeout 10 and
      each through the built CLI: a FIFO at AGENTS.md, a FIFO replacing the
      roles/ directory, a FIFO inside roles/, a symlink at AGENTS.md pointing to
      a FIFO, a dangling symlink, and a symlink loop. None hung; each produced a
      named refusal (named pipe, ENOTDIR, dangling, ELOOP). classifyEntry was
      then measured directly against a FIFO and returned kind irregular in
      bounded time. Having failed to hang the check, I attacked the same
      MECHANISM one step earlier on the same walk and succeeded: mkfifo at the
      install's package.json makes tiphys doctor block forever, exit 124 with
      zero output, and version, --help and status block identically, which
      locates it at startup in src/version.ts:20. The same construction against a
      build of the base commit 7b18144 also hangs, so it is pre-existing.
    finding: CR-002
