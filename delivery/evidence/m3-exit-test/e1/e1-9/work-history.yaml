    result: green
    wrapper-exit-code: 0
    discovered: 849
    passed: 849
    failed: 0
    skipped: 0
    todo: 0
    did-not-run: 0
  - gate: red-witness
    result: green
    wrapper-exit-code: 0
    discovered: 9
    passed: 9
