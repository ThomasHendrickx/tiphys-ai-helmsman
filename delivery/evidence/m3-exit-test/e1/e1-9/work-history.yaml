    skipped: 0
    todo: 0
    did-not-run: 0

claims:
  - id: W-1
    kind: coverage
    statement: >-
      The resolvability predicate does not fail a real published install: the
      pack of this head carries members every one of the three directories'
      filters selects.
    settled-by:
      executed-construction:
        command: npm pack --dry-run --json, counting members by suffix per directory
        exit-code: 0
        output: |
          roles/ members ending .md: 7
          schemas/ members ending .schema.json: 16
          checklists/ members ending .yaml: 5
          AGENTS.md in pack: 1
          total files: 181

  - id: W-2
    kind: open-question
    statement: >-
      I did not establish whether the suffix per directory is right for a
      consuming project that ships a differently-named artifact set. The three
      suffixes are read off this kernel's own consumers, and nothing in this
      release resolves a consuming project's artifacts at all.

  - id: W-3
    kind: remedy
    statement: >-
      The two behaviours the criteria review proved uncovered now redden under
      both declared members of witness/doctor-kernel-artifacts.json.
    settled-by:
      executed-construction:
        command: >-
          node bin/tiphys.ts gates run --registry gate-registry.yaml --mode full
          --only red-witness --evidence <dir> --base origin/main --head HEAD
        exit-code: 0
        output: |
          gates: declared 1 applicable 1 verdict 1 green 1 red 0 not-applicable 0 error 0 vacuous 0
          gates: red-witness: green: 9 witness(es) evaluated (8 own, 1 stored re-evaluated in 12177ms); every witness red against every declared dangerous state and green at head

fix-round:
  - mechanism: >-
      A check reporting on PRESENCE where the property that matters is what
      the artifact RESOLVES, so an install that carries a directory and
      resolves nothing out of it reads as complete.
    derivation:
      command: >-
        grep -n "readdirSync\\|.length === 0\\|.length > 0" src/commands/doctor.ts
      output: |
        2:import { existsSync, readdirSync, readFileSync, statSync } from "node:fs";
        186:  if (missing.length > 0) {
        210:  if (remotes.length === 0) {
        431:    names = readdirSync(charterDir).sort();
        517:  if (declarations.length === 0) {
        547:  const empty = declarations.filter((declaration) => declaration.paths.length === 0);
        548:  if (empty.length > 0) {
        562:      if (present.length === 0) {
        570:      if (kept.length === 0) {
        771:      entries = readdirSync(path);
        781:    if (entries.length === 0) {
        815:  if (missing.length > 0) {
    not-covered: >-
      The derivation is scoped to src/commands/doctor.ts, the file this phase
      owns. It does not cover the other commands, and it finds one further site
      of the same shape inside its own scope: checkRetention at
      src/commands/doctor.ts:561 tests a declared retention path with
      existsSync. That one is NOT fixed here, deliberately: it is M3-P8's check
      with its own criteria and witnesses, and its next test asks whether the
      path is git-ignored, which is already a question beyond presence. Tracked
      rather than closed.
  - mechanism: >-
      Reading a path whose type has not been established, cited by name by
      round 0 at one call site while two others were left unexamined.
    derivation:
      command: >-
        grep -rn "readFileSync(\\|openSync(\\|createReadStream(" src/ --include=*.ts
        | grep -v import | grep -v readRegularFileIfPresent
      output: |
        src/validate.ts:863     GUARDED by classifyEntry at :855
        src/task.ts:189         GUARDED: this IS readRegularFileIfPresent
        src/gates/pin.ts:114    GUARDED by classifyEntry above it
        src/commands/doctor.ts:80  GUARDED AS OF THIS ROUND, by the walk at :72
        src/brief.ts:43         UNGUARDED, no presence test at all
        src/brief.ts:56         UNGUARDED, presence tested, type not established
        src/lock.ts:143         UNGUARDED
        src/lock.ts:164         UNGUARDED
        src/version.ts:27       UNGUARDED, the site the hazard review's hang comes from
        src/pool.ts:171         UNGUARDED, inside a try that cannot catch a block
        src/watcher.ts:591      openSync for APPEND, the write side of the hazard
    not-covered: >-
      Eleven open sites in src/, four guarded and seven not; three further grep
      hits are comment lines and not call sites. The search covers src/ only:
      scripts/ and bin/ carry sixteen more existsSync matches, which are dev
      harness rather than shipped runtime and were not classified. None of the
      seven unguarded sites is inside this phase's files-to-touch, so none is
      fixed here and all seven are tracked. A narrower first attempt, a
      five-line window grep for an open following an existsSync, returned ONE
      hit where the answer is three, because src/version.ts returns the path
      from one function and opens it in another; that miss is why the
      classification above is per-site by reading rather than by window.

environment-warnings:
  - warning: >-
      Running the suite without building first silently skips nine tests and
      still exits 0, so a suite count is only a complete sentence with the
      invocation, the toolchain and the build state beside it.
    evidence: >-
      Every suite number in this record was taken with npm ci exit 0 and npm
      run build exit 0 first, on node v26.6.0 from the scratch prefix, and
      reports 0 skipped: npm test gives 849 tests, 849 pass, 0 fail, 0 skipped;
      node --test test/doctor.test.ts gives 32, 32, 0, 0.
  - warning: >-
      The container's default toolchain is below the declared engine floor, so
      EBADENGINE warnings appear on every npm operation and the floor-gated
      tests skip there.
    evidence: >-
      node --version printed v26.6.0 in the shell that ran each command quoted
      here, from the scratch prefix put first on PATH rather than from the
      ambient resolution.
