# M3 exit test, stage E1.9: the subject phase's work history in the
# machine-readable form the contract defines.
#
# The prose record is delivery/work-history/exit-subject-doctor-kernel-artifacts.md
# on branch claude/exit-subject-doctor-kernel-artifacts, and this is the same
# record in the validated form. It exists for two reasons: E1.9 requires the
# phase work history to validate against schemas/work-history.schema.json, and
# the E1.7 hazard review's CR-005 measured that the bundle shipped no
# work-history.yaml at all, so `verdict-deviations-judged` had nothing but a
# reviewer-authored document to compare a verdict against. A verdict context
# assembled from this file is comparing against the implementer's declaration.
#
# `phase` is M3-P13 because that is the id every plan, brief, verdict and probe
# in this stage carries. The BRANCH is not phase-shaped, by the orchestrator
# ruling recorded as intervention I-3, and that is a fact about the branch
# rather than about the phase id.

kind: work-history
phase: M3-P13

prompt: |
  You are the IMPLEMENTER for the M3 exit test's designated subject: add a
  kernel-artifacts check to tiphys doctor that reports whether the RESOLVED
  kernel install carries roles/, schemas/, checklists/ and AGENTS.md. Deliver
  against the plan instance the exit test produced, with a durable red-witness
  spec. Do not open a pull request and do not merge. Fix round 1 answers the
  two clean-room reviews of stage E1.7.

files-touched:
  - src/commands/doctor.ts
  - test/doctor.test.ts
  - test/behaviors.json
  - witness/doctor-kernel-artifacts.json
  - witness/doctor-kernel-artifacts-resolvability.json
  - witness/doctor-kernel-artifacts-empty-directory.json
  - witness/doctor-kernel-artifacts-fifo.json
  - witness/doctor-kernel-artifacts-resolution.json
  - witness/doctor-kernel-artifacts-unresolvable.json
  - witness/doctor-retention-absent-path-and-full-profile.json
  - witness/doctor-retention-not-applicable-without-a-charter.json
  - witness/captures/doctor-kernel-artifacts-staged-install.txt
  - witness/captures/doctor-kernel-artifacts-resolvability.txt
  - delivery/work-history/exit-subject-doctor-kernel-artifacts.md

per-step-commits:
  - sha: "eb13da6"
    subject: "Rebase onto the witness-ownership fix and re-measure: red-witness is green, and both escapes are re-measured"
  - sha: "04924b6"
    subject: "Fix round 1: resolvability rather than presence, and the two witnesses the class was missing"

key-decisions:
  - decision: >-
      Derive what "resolves" means for each required directory from the
      CONSUMING command's own filter rather than inventing a predicate:
      roles/ .md (src/roles.ts:335), schemas/ .schema.json
      (src/commands/validate.ts:156), checklists/ .yaml (src/checklists.ts:91),
      plus a regular-file and non-empty test on the selected member.
    why: >-
      A check that claims more than the consumer will deliver is a second
      source of truth that drifts. Taking the suffix from the consumer means
      the check and the command it speaks for cannot disagree without one of
      them being edited.
  - decision: >-
      Apply the same content floor to AGENTS.md rather than only to the
      directories.
    why: >-
      The plan's words for the directory member, "an install that carries an
      empty roles/ resolves no role", are true word for word of a zero-byte
      AGENTS.md, and the phase's own emptiness reasoning had been applied to
      the directory member only. That asymmetry is what the hazard review's
      sharpest instance exploited.
  - decision: >-
      Ship witness/doctor-kernel-artifacts.json, the file the plan names, as
      the spec for the removed-DIRECTORY and removed-FILE pair, and keep the
      per-arm siblings beside it.
    why: >-
      The harness requires every named test of a spec to redden under EVERY
      declared member, so a single spec cannot carry arms whose mutations kill
      different tests. The plan's singular filename could not have held them.
      Declared as a deviation rather than absorbed.
  - decision: >-
      Close the mechanism `reading-a-path-whose-type-is-not-established` at
      src/commands/doctor.ts:72 only, and publish the derivation over the
      other sites rather than fixing them.
    why: >-
      That site is inside this phase's files-to-touch and the others are not.
      The hang the hazard review forced comes from src/version.ts:20 and was
      measured PRE-EXISTING at the base 7b18144, so it is another item rather
      than this round's.

verification-first:
  - finding: >-
      The check's success message is a claim about what the install RESOLVES
      while the test behind it was a claim about what is PRESENT, and the gap
      was reachable in four staged shapes, three of them directories and one
      the FILE member of the same class.
    contradicts-plan: true
    stopped-and-reported: >-
      Raised by the E1.7 hazard clean-room review as CR-001 with all four
      shapes forced against a real staged install, and answered in fix round 1
      by a resolution predicate rather than by closing the four instances one
      at a time.
  - finding: >-
      The two behaviours the plan names most explicitly, a removed roles/
      DIRECTORY and a removed AGENTS.md FILE, appeared in no witness spec's
      tests[] and in no failedNamedTests across the seven evaluations of round
      0, so neither had been demonstrated red by construction.
    contradicts-plan: true
    stopped-and-reported: >-
      Raised by the E1.7 criteria clean-room review as CR-002, confirmed there
      by reading witness-records.json rather than by reading the specs, and
      answered in fix round 1 by witness/doctor-kernel-artifacts.json.
  - finding: >-
      A test named "a staged install missing roles/ is a FAIL naming roles/"
      asserted WARN, so its reported name was a true statement about the CLI
      and a false one about the test.
    contradicts-plan: false
  - finding: >-
      Criterion 10's unresolvable arm is real at the unit level and dead at
      the command level, because readOwnVersion refuses at src/version.ts:20
      before any command runs.
    contradicts-plan: false

deviations:
  - plan-clause: >-
      M3-P13 step, "the root is computed from import.meta.url WITHOUT
      searching upward"
    why: >-
      A fixed depth is wrong in one of the two shipped layouts, measured: the
      published package puts the module at dist/src/commands/doctor.js with
      the artifacts three levels up, the development checkout at
      src/commands/doctor.ts with them two levels up, and dist/package.json is
      not in the 181-file pack listing. The search key is package.json, the
      package boundary rather than a member of the audited set, so the class of
      attack that killed kernelRoot does not apply and criterion 9's test
      proves it.
  - plan-clause: >-
      M3-P13 files-to-touch and acceptance criterion 7, both naming exactly
      witness/doctor-kernel-artifacts.json
    why: >-
      That file now exists and carries the two behaviours the plan's witness
      step names. Five sibling specs and two captures sit beside it, none of
      them on files-to-touch, because the harness requires every named test of
      a spec to redden under EVERY declared member, which forces one spec per
      arm. Offered for a reviewer's judgment rather than asserted as settled.

