# The assurance modes (blueprint section 8; R-024, R-096). "The current proven
# process is the definition of `full`. Downgrades are declared, never
# improvised": `skips` names every stage of `full`'s pipeline a mode omits.
#
# A mode's gates are the gate-registry.yaml gates whose `modes` name it;
# `tiphys mode show` derives the list, so this file carries no copy (M6-P3).
#
# The kernel runs `full` only. `direct-pr` and `local-only` are declared and
# validated, never exercised.

kind: assurance-modes
version: 1

modes:
  - id: full
    declared-by: >-
      blueprint section 8 (the mode and its pipeline); process doc section 9
      item 3 enumerated (R-096); T-003 for the fix-round-verification stage;
      DR-0012 and DR-0015 for the merge authority actually in force; DR-0016
      for the escalation response; DR-0035 for the fix-round ceiling; DR-0063
      and DR-0064 for the review contract.
    # Order is load-bearing (R-024): the adversarial plan review comes before
    # anyone builds.
    pipeline:
      - intake
      - verification-pass
      - plan
      - adversarial-plan-review
      - implement
      - clean-room-review
      - fix-round
      - fix-round-verification
      - merge-on-green
      - deploy-verify
      - migration-verify
      - final-report
    skips: []
    # DR-0064: the criteria contract is dropped (acceptance criteria are tests
    # the kernel runs). A change owes the hazard reviews of its DR-0063 tier:
    # two for pair, one for single.
    review-contracts:
      - hazard
    # Not the blueprint's `owner`: DR-0012 delegated merge authority and
    # DR-0015 took the owner off the merge path.
    merge-authority: delegated-under-conditions
    granted-by: DR-0012
    # DR-0012's conditions in the record's words, less condition 3 (both
    # reviewers walked the acceptance criteria), which DR-0064 supersedes.
    conditions:
      - >-
        Two independent clean-room reviews exist for the current head, produced
        on different model families, each written to `delivery/review/` and
        committed.
      - >-
        Neither review carries an unresolved finding at high or medium
        severity. Low findings may be merged with, provided each is either
        fixed or explicitly recorded as a tracked item with a reason.
      - >-
        CI is green on the exact head being merged, not on an earlier one.
      - >-
        The scope audit passes: changed files are on the phase's files-to-touch
        list plus the two standing pre-authorized extras.
      - >-
        Where the reviews disagree, the orchestrator arbitrates with evidence
        and records the arbitration in the merge commit or in the review file.
        A disagreement is never resolved by preferring the more convenient
        verdict.
    # Data the orchestrator brief cites; nothing counts fix rounds. The number
    # is DR-0035's ceiling of 3, not DR-0012's 2.
    escalation-bounds:
      max-fix-rounds-after-review: 3
      recurrence-of-high-in-one-component: 1
      on-exceeded: fresh-implementer-and-third-contract

  - id: direct-pr
    declared-by: >-
      blueprint section 8 row 2, "implement + gates, no adversarial layers",
      with merge authority `owner` from the same row.
    pipeline:
      - intake
      - plan
      - implement
      - merge-on-green
      - final-report
    skips:
      - verification-pass
      - adversarial-plan-review
      - clean-room-review
      - fix-round
      - fix-round-verification
      - deploy-verify
      - migration-verify
    merge-authority: owner

  - id: local-only
    declared-by: >-
      blueprint section 8 row 3, "implement, orchestrator diff review, local
      fast-forward", with merge authority "owner approves, orchestrator
      merges", which SC-008 and plan v1 D-6 read as
      owner-approves-orchestrator-merges.
    pipeline:
      - implement
      - orchestrator-diff-review
      - merge-on-green
    skips:
      - intake
      - verification-pass
      - plan
      - adversarial-plan-review
      - clean-room-review
      - fix-round
      - fix-round-verification
      - deploy-verify
      - migration-verify
      - final-report
    # A regime the kernel itself has left (DR-0015); kept because blueprint
    # section 8 assigns it to this row and another project may want it.
    merge-authority: owner-approves-orchestrator-merges
