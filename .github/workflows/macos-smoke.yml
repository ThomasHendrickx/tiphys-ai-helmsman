name: macOS smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.6.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/scope-gate.test.ts test/credentials-gate.test.ts test/suite-gate.test.ts test/spawn.test.ts test/authored-bytes.test.ts
      - run: node scripts/check-authored-bytes.mjs
