name: gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  gates:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every matrix leg succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}" >&2
            exit 1
          fi
          echo "all matrix legs succeeded"
