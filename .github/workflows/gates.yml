name: gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# ONE job, named `gates`. DR-0004's required status context is the string
# `gates` verbatim, and a job named `gates` with no matrix publishes exactly
# that context, so branch protection is satisfied by this job directly and its
# red/green is the real build+test+gate outcome rather than a fan-in over it.
#
# This replaces the earlier two-job shape (a matrix `test` job plus a `gates`
# fan-in that only asserted the matrix succeeded). That shape needed a SECOND
# runner acquisition per run for the fan-in, and under any runner contention
# the fan-in starved in the queue and GitHub cancelled it, turning correct
# heads red and stalling the merge train. Owner decision (2026-08-06): collapse
# to one job so each run acquires one runner. The node floor is >=26 and CI on
# Node 26 is the authority (CLAUDE.md), so the single leg pins node 26 without a
# matrix; adding a matrix would change the context to `gates (26)` and break the
# required-check name.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. A shallow checkout has only the tip
      # commit, so `git diff base...head` and `git merge-base` exit nonzero
      # against any other ref. M2-P5's citation-linter, M2-P2's and M2-P4's
      # gates, and M2-P9's exit harness all need real history from the suites
      # `npm test` exercises, and none of those phases' files-to-touch lists
      # include this workflow file. Full history costs one slower checkout.
      # ref is load-bearing for the scope gate. On a pull_request event
      # actions/checkout DEFAULTS to a DETACHED HEAD (it checks out the
      # ephemeral merge commit, refs/pull/N/merge, not the source branch), so
      # `git rev-parse --abbrev-ref HEAD` returns the literal string "HEAD".
      # The scope gate's branch-matches precondition (src/gates/run.ts) and the
      # gate's own current-branch cross-check (src/gates/scope.ts) both read
      # that value; against a detached "HEAD" neither can ever match
      # ^claude/mN-pM-...$, so on EVERY CI pull_request run scope reported
      # not-applicable and never audited a real diff, and the exit harness
      # accepted that N/A and passed vacuously for scope (the very hazard M2-P9
      # exists to prevent, one layer up). Checking out the head branch BY NAME
      # (github.head_ref) puts the runner on claude/mN-pM-..., so
      # `git rev-parse --abbrev-ref HEAD` returns the branch name and scope
      # genuinely audits the diff. The bundle step below still passes
      # --head <pull_request.head.sha>; checking out the branch by name leaves
      # HEAD at that same tip, and the scope gate's --head-equals-checked-out
      # cross-check confirms they agree. On a push to main github.head_ref is
      # empty, so checkout falls back to the pushed ref exactly as before; the
      # push (main) bundle does not run scope, so it is unaffected either way.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The M2 exit-test harness (kernel plan M2, M2-P9 step 5, M2R-026). This
      # REPLACES M2-P1's two interim `--only manifest-self-check` bundle steps:
      # the harness is now the SINGLE caller of `gates run`, so the gate set
      # runs ONCE per run and exactly one `summary.json` is produced per job
      # (criterion 5). npm ci and npm run build already ran above, so `--no-build`
      # skips the harness's own step 1 rebuild rather than paying it twice.
      #
      # Two steps, mutually exclusive by event, so only one bundle runs per job:
      #   pull request  the STRONG PR bundle, --base/--head from the PR event and
      #                 --phase derived from the source branch (lowercase, to
      #                 match the phase-declaration filename the scope gate reads).
      #                 --head is `pull_request.head.sha`, NOT `github.sha`, which
      #                 on a pull_request trigger is the ephemeral merge commit
      #                 (CR-830-1). The harness asserts the bundle against section
      #                 1.4's PR-bundle column.
      #   push          the WEAKER main bundle (--bundle main), which needs no
      #                 base, head or phase; the three diff-scoped gates are not
      #                 run and the harness asserts their absence explicitly.
      # THE AGENT-RULES DRIFT CHECK (kernel plan M3, M3-P2 step 5; R-094,
      # T-009, D-M3-34).
      #
      # The check is DECLARED in gate-registry.yaml as the gate
      # `agent-rules-drift` with `events: [pull_request, push]`, which is where
      # D-M3-34 requires every M3 check to live. It ALSO runs here, as one step
      # in the existing single `gates` job, and the reason is measurable rather
      # than a preference:
      #
      #   1. The push arm cannot reach it otherwise. scripts/m2-exit-test.sh
      #      runs the main bundle with a HARD-CODED `--only` list of six gate
      #      ids; a gate outside that list is never run on a push to main. That
      #      script is owned by M2-P9 and is not on this phase's files-to-touch
      #      list, so this phase cannot extend the list.
      #   2. The assertion program never SEES it. run_pr_bundle records the
      #      runner's exit code but does not act on it; the assertion program
      #      decides. That program USED to examine only gates named in its
      #      expectations table, which was the defect PR #44 fixed for the
      #      clause-map gate; it no longer does, and this reason has been
      #      rewritten rather than left standing. It now derives its expected
      #      set from gates.manifest.json and from the bundle's own rows, and a
      #      declared gate with no table row is asserted required-green, so a
      #      table row is NOT what a manifest gate needs any more. What still
      #      holds is narrower and is what keeps this step necessary:
      #      `agent-rules-drift` is declared in gate-registry.yaml and NOT in
      #      gates.manifest.json, so the runner never runs it, it produces no
      #      bundle row, and neither the manifest leg nor the rows leg of that
      #      derivation can reach it. Promoting it to the manifest is a
      #      separate decision, tracked with the orchestrator as the open half
      #      of R-094; until then this step is what executes it.
      #
      # CLAUDE.md drift is a property of `main`, not of a pull request (T-009),
      # so this step carries NO `if:` and runs on BOTH events. Adding one would
      # be the sixth defang in kernel plan M3 section 2.3 rule 7's list.
      #
      # DR-0017 and DR-0004: this is a STEP in the one job named `gates`. It
      # adds no job and no matrix, so the published required status context is
      # still the literal string `gates`.
      - name: Agent-rules gate-list drift (gate-registry.yaml is the single source, R-094)
        run: node scripts/render-agent-rules-gates.mjs --check
      - name: M2 exit test (pull request)
        if: github.event_name == 'pull_request'
        run: >
          scripts/m2-exit-test.sh
          --no-build
          --bundle pr
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --phase "$(printf '%s' "${{ github.head_ref }}" | sed -E 's#^(claude/)?(m[0-9]+-p[0-9]+).*#\2#')"
          "${{ runner.temp }}/m2-exit-evidence"
      - name: M2 exit test (push)
        if: github.event_name != 'pull_request'
        run: >
          scripts/m2-exit-test.sh
          --no-build
          --bundle main
          "${{ runner.temp }}/m2-exit-evidence"
      # The falsifiability guard of M2-P9 criterion 3, run as a gate rather than
      # trusted to a work history (mirrors the M1-P6 pattern, CR-605). The exit
      # test's whole value is that its assertion code REFUSES a vacuous bundle,
      # so the assertion code must be shown to fail on a vacuous one. `--self-test`
      # runs that assertion code over two fixture manifests (a gate reporting
      # green with units 0, and a required gate whose file-exists precondition is
      # unmet) and exits NONZERO when it correctly rejects both. This step FAILS
      # THE JOB if `--self-test` exits 0, which is the state where the assertion
      # code let a vacuous bundle through and can no longer be trusted. It tests
      # BEHAVIOUR, not text: the assertion code is exercised, not asserted about.
      - name: M2 exit test self-test guard (the assertion code must reject a vacuous bundle)
        run: |
          set -u
          evidence="${{ runner.temp }}/m2-self-test"
          if scripts/m2-exit-test.sh --self-test "${evidence}"; then
            echo "FALSIFIABILITY GUARD BROKEN: m2-exit-test.sh --self-test exited 0." >&2
            echo "The assertion code failed to reject a vacuous fixture bundle, so it cannot be trusted to reject a vacuous real one." >&2
            exit 1
          fi
          echo "m2 self-test falsifiability guard witnessed: --self-test exited nonzero, so the assertion code rejects a vacuous bundle."
      # The M1 exit-test harness in local mode (kernel plan v1, M1-P6 step 4):
      # the skeleton plumbing exercised end to end on every kernel PR. It
      # re-runs the three gates above as its own A1 precondition (section 4's
      # procedure, not a duplication to optimize away). A failure here fails the
      # run, which reddens the required `gates` context.
      - name: M1 exit test (local mode)
        run: scripts/m1-exit-test.sh --mode local "${{ runner.temp }}/m1-exit-evidence"
      # The falsifiability guard of M1-P6 criterion 5, run as a gate rather than
      # trusted to a work history (CR-605). A certification harness must be able
      # to fail; before this step CI ran only the green path, so a regression to
      # unconditionally-green would have turned nothing red. This costs a second
      # full harness run per run and that is the price of the property. Do not
      # delete it to save minutes.
      - name: M1 exit test falsifiability guard (the harness must be able to fail)
        run: |
          set -u
          evidence="${{ runner.temp }}/m1-exit-falsify"
          if TIPHYS_EXIT_TEST_SKIP_STAGE_B=1 scripts/m1-exit-test.sh --mode local "${evidence}"; then
            echo "FALSIFIABILITY GUARD BROKEN: the harness exited 0 with stage B skipped." >&2
            echo "Nothing was merged, so C2 teardown should have refused and the run should have failed." >&2
            exit 1
          fi
          # Exiting nonzero is necessary but not sufficient: it must fail at C2
          # on teardown refusing unlanded work, not somewhere else.
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1] + "/records";
            // Decide, do not crash. readdirSync throws when the harness exited
            // nonzero without creating records/, and the guard would then
            // "fire" by unhandled exception rather than by its own check.
            if (!fs.existsSync(dir)) {
              console.error("the harness left no records directory: " + dir);
              console.error("it exited nonzero, but not by failing a recorded step, so the guard cannot confirm it failed at C2");
              process.exit(1);
            }
            const c2 = fs.readdirSync(dir)
              .filter((f) => f.endsWith("-C2.json"))
              .map((f) => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .filter((r) => r.kind === "executed");
            const failing = c2.filter((r) => r.exitCode !== 0 && r.outcome === "fail");
            if (failing.length === 0) {
              console.error("no C2 record showing a nonzero teardown exit with outcome fail");
              console.error(JSON.stringify(c2, null, 2));
              process.exit(1);
            }
            // Total on purpose: it must NOT throw when failing is empty.
            console.log(
              "falsifiability guard witnessed at C2: exitCode " +
                failing.map((r) => String(r.exitCode)).join(","),
            );
          ' "${evidence}"
