name: gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The M2 gate bundle (kernel plan M2, M2-P1 step 9). This runs INSIDE
      # the existing `test` job on purpose: check-run contexts are derived
      # from job names and matrix values, so the published contexts stay
      # `test (26)` and `gates`, and DR-0004's required context named
      # verbatim `gates` is untouched. Adding a job here would add a context
      # and require a ruleset change nobody has approved.
      #
      # The bundle carries one gate today, `manifest-self-check`, and that
      # is deliberate: a runner wired to an empty gate set reports a green
      # bundle over nothing measured, which is the failure this milestone
      # exists to make impossible (M2R-012), so the first CI run measures
      # something real. M2-P9 later replaces this step with the exit harness
      # so the set runs once (M2R-026).
      #
      # Two steps rather than one expression: on a pull request the base and
      # head SHAs exist and are passed; on a push to main they do not, and a
      # gate needing them reports `error` rather than being silently skipped.
      - name: M2 gate bundle (pull request)
        if: github.event_name == 'pull_request'
        run: >
          node dist/bin/tiphys.js gates run
          --manifest gates.manifest.json
          --evidence "${{ runner.temp }}/gate-evidence"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"
      - name: M2 gate bundle (push)
        if: github.event_name != 'pull_request'
        run: >
          node dist/bin/tiphys.js gates run
          --manifest gates.manifest.json
          --evidence "${{ runner.temp }}/gate-evidence"
      # The M1 exit-test harness in local mode (kernel plan v1, M1-P6
      # step 4): the skeleton plumbing is exercised end to end on every
      # kernel PR from this phase on. It re-runs the three gates above as
      # its own A1 precondition, which is section 4's procedure and not a
      # duplication to optimize away. A failure here fails this matrix
      # leg, which the gates fan-in job below turns red.
      - name: M1 exit test (local mode)
        run: scripts/m1-exit-test.sh --mode local "${{ runner.temp }}/m1-exit-evidence"
      # The falsifiability guard of M1-P6 criterion 5, run as a gate
      # rather than trusted to a work history (CR-605). The single most
      # important property of a certification harness is that it CAN
      # fail; before this step, a regression to unconditionally-green
      # would have turned nothing red anywhere, because CI ran only the
      # green path. This costs a second full harness run per leg and that
      # is the price of the property. Do not delete it to save minutes.
      - name: M1 exit test falsifiability guard (the harness must be able to fail)
        run: |
          set -u
          evidence="${{ runner.temp }}/m1-exit-falsify"
          if TIPHYS_EXIT_TEST_SKIP_STAGE_B=1 scripts/m1-exit-test.sh --mode local "${evidence}"; then
            echo "FALSIFIABILITY GUARD BROKEN: the harness exited 0 with stage B skipped." >&2
            echo "Nothing was merged, so C2 teardown should have refused and the run should have failed." >&2
            exit 1
          fi
          # Exiting nonzero is necessary but not sufficient: it must fail
          # at C2 on teardown refusing unlanded work, not somewhere else.
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1] + "/records";
            // Decide, do not crash. readdirSync throws when the harness
            // exited nonzero without creating records/, and the guard
            // would then "fire" by unhandled exception rather than by
            // its own check. Same lesson as the C2 arm below; this was
            // the last instance of it in these twelve lines.
            if (!fs.existsSync(dir)) {
              console.error("the harness left no records directory: " + dir);
              console.error("it exited nonzero, but not by failing a recorded step, so the guard cannot confirm it failed at C2");
              process.exit(1);
            }
            const c2 = fs.readdirSync(dir)
              .filter((f) => f.endsWith("-C2.json"))
              .map((f) => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .filter((r) => r.kind === "executed");
            const failing = c2.filter((r) => r.exitCode !== 0 && r.outcome === "fail");
            if (failing.length === 0) {
              console.error("no C2 record showing a nonzero teardown exit with outcome fail");
              console.error(JSON.stringify(c2, null, 2));
              process.exit(1);
            }
            // Total on purpose: it must NOT throw when failing is empty.
            // While this line read failing[0].exitCode, deleting the
            // process.exit(1) above still produced a nonzero exit, via
            // an unhandled TypeError rather than via the check. That
            // made the explicit exit look load-bearing when it was not,
            // and hid the deletion from the test that guards this step.
            console.log(
              "falsifiability guard witnessed at C2: exitCode " +
                failing.map((r) => String(r.exitCode)).join(","),
            );
          ' "${evidence}"

  gates:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every matrix leg succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}" >&2
            exit 1
          fi
          echo "all matrix legs succeeded"
