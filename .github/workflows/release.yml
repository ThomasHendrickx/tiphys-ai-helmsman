# THE RELEASE WORKFLOW (kernel plan M3, M3-P10 step 4; DR-0008, DR-0024).
#
# IT NEVER RUNS ON PUSH. `workflow_dispatch` is the only trigger, and that is
# the plan's requirement in its own words: "a manually dispatched workflow that
# runs the gates, the license gate, `npm pack`, and publishes to the DR-0008
# registry ... it never runs on push"
# (delivery/plan/kernel-plan-m3.md:4875). Publishing is the one action in this
# milestone with no clean undo, so nothing automatic may reach it.
#
# THE FILENAME AND THE JOB NAME ARE THE INTERFACE TO OWNER ACTION A-7 PART 2.
# npm's trusted-publisher configuration names a repository AND a workflow FILE,
# so this file's path is a value the owner types into the npm UI, and renaming
# it later invalidates that configuration and makes every publish fail closed.
# Treat `.github/workflows/release.yml` as a published identifier, not a name.
#
# AUTHENTICATION IS OIDC, AND THERE IS NO TOKEN (DR-0024, decided 2026-08-10).
# The workflow requests a short-lived audience-scoped token from GitHub's OIDC
# provider at publish time and npm verifies it against the trusted-publisher
# configuration. No npm credential is created, stored, or scrubbed for, which
# is why no repository secret appears anywhere below and why the npm auth
# environment variable is not set. `permissions: id-token: write` is what allows
# the token to be minted; DR-0024:71 records that without it the publish FAILS
# CLOSED, which is the correct direction.
#
# WHY `contents: read` IS WRITTEN OUT rather than left to the default: naming
# any permission replaces the whole default set, so the two lines below are the
# complete grant. This job reads the repository and mints an OIDC token; it can
# do nothing else.
#
# NOTHING HERE HAS RUN. This workflow is delivered by M3-P10 in the state the
# plan and DR-0024's addendum require: ready, named, and not executed. The
# sequencing is DR-0024:120 and it is not optional, because the middle step is
# not ours:
#
#   1. M3-P10 writes this file. It does NOT publish.
#   2. OWNER (A-7 part 2), needing the filename from step 1: publish the 0.0.0
#      stub for @tiphys/kernel, deprecate it, and configure the trusted
#      publisher against this repository and this workflow file.
#   3. Only then can a dispatch of this workflow publish 0.1.0 over OIDC.
#
# WHY THE RELEASE STEPS ARE AT WORKFLOW LEVEL AND NOT IN gate-registry.yaml,
# stated because D-M3-34 requires that reason to be given rather than left
# implicit (delivery/plan/kernel-plan-m3.md:4891): these steps run on a manual
# dispatch, which is an event the gate bundle never sees. The LICENSE GATE is
# the opposite case and is a registry entry, because it is a property of every
# change and not of a release.
#
# ------------------------------------------------------------------------
# THREE THINGS FIX ROUND 1 CHANGED, AND WHY. All three came from the clean-room
# hazard review and all three are about the same class of mistake: a guard that
# is DESCRIBED rather than EXERCISED.
#
# 1. NO `${{ }}` APPEARS INSIDE ANY `run:` BODY (HRB-11). Actions substitutes
#    those textually BEFORE the shell parses the line, so an operator supplying
#    the literal text `$declared` was supplying SHELL SOURCE, not a string to
#    compare: the version-agreement guard then agreed with whatever
#    package.json held, and a `$(...)` value executed, in a job holding
#    `id-token: write`. Every operator-supplied value now reaches the shell
#    through `env:`, which the runner sets rather than pastes.
#
# 2. THE PUBLISH DECISION IS A SHELL SCRIPT, NOT A GITHUB EXPRESSION (HRB-3,
#    HRB-4). The old guard was `if: ${{ inputs.dry-run == false }}`, and the
#    only automated check on it asserted that its TEXT contained "dry-run", so
#    three separately inverted guards including publish-always were all green.
#    The decision now lives in the `decide` step's `run:` body, which
#    `test/license-gate.test.ts` EXTRACTS AND EXECUTES against a table of
#    inputs. The `if:` expressions that remain are asserted by EXACT STRING
#    EQUALITY, which reddens on every inversion.
#
#    The boolean input is gone with it. `== false` coerces: GitHub casts
#    operands of differing types to numbers, and `null` and `''` both cast to 0
#    like `false` does, so the two wrong values that fail OPEN were the ones a
#    dispatch is most likely to deliver. The replacement is a `confirm` STRING
#    the operator must type to match the version exactly. A string comparison
#    performs no coercion, an empty confirm rehearses, and publishing now needs
#    a deliberate act rather than the absence of one.
#
# 3. THE ARTIFACT IS INSTALLED AND EXECUTED BEFORE THE PUBLISH, IN BOTH ARMS
#    (HRB-5). Every pre-publish check used to inspect a LISTING, and a listing
#    check does not establish that the artifact runs: changing `files` from
#    `dist` to `dist/bin` was measured to pass both pack tests, this workflow's
#    own pack check and the license gate, and to produce a package whose bin
#    dies with ERR_MODULE_NOT_FOUND. Release verification ran only AFTER the
#    publish, so the one check that could see it could only report the damage.
#    It now runs against the locally packed tarball BEFORE the publish step, on
#    every dispatch including a rehearsal, and the post-publish run against the
#    registry is kept as well, because they answer different questions.
# ------------------------------------------------------------------------

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The exact version expected in package.json, for example 0.1.0. The job
          REFUSES to run when package.json disagrees. This is a second pair of
          eyes on the one irreversible field, not a way to set it.
        required: true
        type: string
      confirm:
        description: >-
          To PUBLISH, type the version again here, exactly. Anything else,
          including leaving it empty, runs the full rehearsal and stops before
          publishing. A string comparison, so no value coerces its way into a
          publish.
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # THE ONLY REASON THIS OUTPUT EXISTS is the `tag` job's second gate
    # (DR-0032, M3-P12). `steps.decide.outputs.publish` is visible only inside
    # this job, so without a job-level output the tag job has no way to
    # distinguish a rehearsal, which SUCCEEDS, from a publish. `needs: tag`
    # alone would therefore tag every rehearsal.
    #
    # It is a bare reference and nothing else, and that is asserted by
    # EVALUATION in test/license-gate.test.ts rather than by matching its text:
    # the test parses this expression and runs it against a table of decide
    # outputs, so an output pinned to a literal `yes` is red even though its
    # text still mentions the step.
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      # fetch-depth: 0 for the same reason .github/workflows/gates.yml gives:
      # several gates and the exit harness need real history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # npm's trusted-publishing support is version-dependent, and DR-0024:75
      # requires this workflow to PIN and RECORD the npm version it used rather
      # than inherit whatever the runner image ships. The pin is what makes a
      # later "which npm published this" answerable.
      - name: Pin and record the npm version (DR-0024)
        run: |
          npm install -g npm@11.18.0
          echo "npm $(npm --version), node $(node --version)"

      # THE DECISION, AND IT IS SHELL SO THAT A TEST CAN RUN IT.
      #
      # `test/license-gate.test.ts` extracts this exact `run:` body out of this
      # file and executes it under bash against a table of REQUESTED, CONFIRM
      # and declared-version combinations, asserting the `publish=` it writes.
      # That is the difference between a guard that is checked and a guard that
      # is described. Keep the body self-contained and keep every input in
      # `env:`; both properties are asserted by that test.
      #
      # Two outcomes are NOT the same and are kept apart deliberately:
      #   - version disagreement is an ERROR (exit 1). The operator asked about
      #     a version this tree is not, and continuing would run every gate
      #     against something other than what was asked for.
      #   - confirm mismatch is a REHEARSAL (exit 0, publish=no). That is the
      #     ordinary path and it must not look like a failure, or operators
      #     learn to ignore red.
      - name: Decide whether this dispatch publishes
        id: decide
        env:
          REQUESTED: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -u
          declared="$(node -p 'require("./package.json").version')"
          if [ "$declared" != "$REQUESTED" ]; then
            echo "release: package.json declares ${declared} and this dispatch asked for ${REQUESTED}." >&2
            echo "release: refusing. A published version cannot be unpublished cleanly, so the two must agree before anything runs." >&2
            exit 1
          fi
          if [ "$CONFIRM" = "$declared" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "release: confirm matches ${declared}; this dispatch WILL publish after every check below passes."
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "release: confirm does not match ${declared}; this dispatch is a REHEARSAL and will not publish."
          fi

      # The ordered preflight of CLAUDE.md's gate list, run here in full rather
      # than assumed from a green pull request. T-009's rule is that a gate
      # result is evidence only for the configuration it ran under, and a
      # release is a configuration no pull-request run has taken.
      - run: npm ci
      - run: npm run build
      - name: git status must be clean after the build (plan decision D-17)
        run: |
          set -u
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain >&2
            echo "release: the build left the tree dirty; dist/ is never committed and a dirty tree here means something else changed." >&2
            exit 1
          fi
      - run: npm test

      - name: License gate (EXT-F-09, M3-P10 step 2)
        run: node scripts/license-gate.mjs

      # A REAL PACK, not a dry run, because the next step installs what this
      # produces. `prepack` rebuilds, which is why the listing here is always a
      # built tree and why the build state is printed beside the count (HRB-10:
      # a pack number quoted without its build state starts an investigation).
      - name: npm pack, and check the listing against the tree on disk
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/artifact"
          npm pack --pack-destination "$RUNNER_TEMP/artifact"
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const { readFileSync, readdirSync } = require("node:fs");
            const { join } = require("node:path");
            const listing = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))[0];
            const files = listing.files.map((entry) => entry.path.replace(/^package\//, ""));
            const problems = [];
            for (const name of ["LICENSE", "AGENTS.md", "gate-registry.yaml", "assurance-modes.yaml", "role-model-config.yaml"]) {
              if (!files.includes(name)) problems.push("missing " + name);
            }
            for (const dir of ["delivery", "test", "sandbox", "src", "scripts", "witness"]) {
              if (files.some((path) => path === dir || path.startsWith(dir + "/"))) problems.push("forbidden " + dir + "/");
            }
            /* THE dist LEG GETS AN ORACLE (HRB-5). Every other shipped directory
               is compared against git ls-files; dist/ is built and untracked, so
               its oracle is the built tree itself. A presence check here is what
               let a files list of ["dist/bin"] pass with two entries where 121
               were expected. */
            const walk = (dir, prefix) => {
              const out = [];
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                if (prefix === "dist/" && entry.name === "node_modules") continue;
                const here = prefix + entry.name;
                if (entry.isDirectory()) out.push(...walk(join(dir, entry.name), here + "/"));
                else out.push(here);
              }
              return out;
            };
            const onDisk = walk("dist", "dist/");
            const packed = new Set(files);
            const absent = onDisk.filter((path) => !packed.has(path));
            console.log(listing.entryCount + " pack entries, " + onDisk.length + " files under dist/ on disk (built tree)");
            if (absent.length > 0) problems.push(absent.length + " built file(s) missing from the pack, first: " + absent.slice(0, 5).join(", "));
            if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          '

      # RELEASE VERIFICATION BEFORE THE PUBLISH, ON EVERY DISPATCH (HRB-5).
      #
      # This is the only check in the phase that INSTALLS the artifact and RUNS
      # it. Everything above inspects a listing. It carries no `if:` on purpose:
      # a rehearsal that does not run it is a rehearsal that cannot catch the
      # thing the rehearsal exists for.
      #
      # `cd "$RUNNER_TEMP/verify"` is not tidiness: scripts/release-verify.sh
      # REFUSES to run anywhere the package is already resolvable, and the
      # checkout is exactly that, so running it from the workspace would fail by
      # design.
      - name: Install and RUN the packed artifact, before any publish (SC-011)
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -u
          tarball="$(ls "$RUNNER_TEMP"/artifact/*.tgz | head -1)"
          name="$(node -p 'require("./package.json").name')"
          mkdir -p "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          bash "$GITHUB_WORKSPACE/scripts/release-verify.sh" "$name" "$REQUESTED" \
            --tarball "$tarball" --records "$RUNNER_TEMP/verify/pre-publish-records.json"
          cat "$RUNNER_TEMP/verify/pre-publish-records.json"

      # THE PUBLISH. Its guard is asserted by EXACT STRING EQUALITY in
      # test/license-gate.test.ts, together with the rehearsal step's guard
      # below, which must be its exact complement. Changing either string
      # reddens that test.
      - name: Publish to npmjs over OIDC (DR-0008 registry, DR-0024 authentication)
        if: ${{ steps.decide.outputs.publish == 'yes' }}
        run: npm publish --access public --provenance

      - name: Rehearsal only, nothing was published
        if: ${{ steps.decide.outputs.publish != 'yes' }}
        run: |
          echo "release: this dispatch was a rehearsal. Every gate ran, the artifact was packed, installed and executed, and npm publish did NOT run."
          echo "release: to publish, re-dispatch with confirm set to the exact version."

      # The post-publish run answers a DIFFERENT question from the pre-publish
      # one: not "does this artifact work" but "does the artifact the registry
      # now serves work". Both are wanted; only the first can prevent a bad
      # publish.
      #
      # M3-P12 FIX ROUND 1 MADE THIS STEP LOAD-BEARING FOR A SECOND REASON, and
      # it is stated here because the step now carries weight its own comment
      # did not describe. **This is the ONLY step anywhere in this workflow that
      # OBSERVES THE REGISTRY.** The tag job's two gates are both proxies: one
      # reads the operator's intent, recorded before `npm ci` runs, and the other
      # reads this job's conclusion, which is a statement about the runner. The
      # property DR-0032 protects is that npm actually serves the version, and
      # this step is the only place that is ever established. Deleting it, or
      # giving it `--tarball` so that it verifies a local file instead, would
      # leave the whole chain modelling what it should read. Both are now
      # reddened by `test/license-gate.test.ts`, which also requires this step to
      # carry the publish step's exact guard and to run after it.
      - name: Release verification against the registry, after publishing (SC-011)
        if: ${{ steps.decide.outputs.publish == 'yes' }}
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -u
          name="$(node -p 'require("./package.json").name')"
          mkdir -p "$RUNNER_TEMP/verify-registry"
          cd "$RUNNER_TEMP/verify-registry"
          bash "$GITHUB_WORKSPACE/scripts/release-verify.sh" "$name" "$REQUESTED" \
            --records "$RUNNER_TEMP/verify-registry/records.json"
          cat "$RUNNER_TEMP/verify-registry/records.json"

  # ------------------------------------------------------------------------
  # THE TAG AND THE GITHUB RELEASE (DR-0032, phase M3-P12).
  #
  # WHY A SECOND JOB AND NOT A STEP. Naming any permission replaces the whole
  # default set, so a job's `permissions:` block is its complete grant. Adding
  # `contents: write` to the job above would widen the grant held by the job
  # that mints the OIDC token, which is the wrong direction; DR-0032:60 decided
  # two jobs for exactly that reason. This job holds `contents: write` and NO
  # `id-token`, and the absence is asserted as an absence in
  # test/license-gate.test.ts, not as some particular value.
  #
  # THE HAZARD THIS JOB IS SHAPED BY, in the owner's terms (DR-0032:44): the
  # GitHub release is the owner's mental model of what exists, so a release or
  # a tag that exists WITHOUT a corresponding published version is worse than
  # having none. It is a confident anchor pointing at nothing. Every guard
  # below is that hazard, and none of them is about the npm package being
  # wrong.
  #
  # TWO INDEPENDENT GATES, because each covers a failure the other does not:
  #
  #   - `needs: release` means this job does not run if ANY step of the release
  #     job failed, INCLUDING the post-publish registry verification. That is
  #     the "the publish happened and then something was wrong" case.
  #
  #     THAT SENTENCE WAS TRUE AND UNASSERTED UNTIL FIX ROUND 1, which is the
  #     defect the round was dispatched for. A job CONCLUSION only reports its
  #     steps while nothing decouples the two, and `continue-on-error` at either
  #     level does exactly that; the registry verification could also simply be
  #     deleted. Four such one-line edits were measured invisible to the whole
  #     suite. `test/license-gate.test.ts` now asserts, over the `needs` closure
  #     of whichever job holds the write grant, that no job and no step in it
  #     carries `continue-on-error`, and that the registry verification exists,
  #     carries this job's own guard string, and runs after the publish.
  #   - `if: needs.release.outputs.publish == 'yes'` means it does not run on a
  #     REHEARSAL, which is the ordinary path and which SUCCEEDS. `needs:`
  #     alone is green on every rehearsal, so it would tag a dispatch that
  #     published nothing. That is the "nothing was published at all" case.
  #
  # Neither is claimed to be sufficient; the spec asks a reviewer to look for a
  # third (delivery/plan/m3-p12-phase-spec.md:86).
  #
  # WHAT HAPPENS IF THE TAG WRITE FAILS AFTER A SUCCESSFUL PUBLISH, stated
  # rather than left implicit because the spec requires the choice to be named:
  # this job FAILS LOUDLY and the published version exists with no tag. That is
  # the deliberate direction. The state DR-0032 forbids is an anchor pointing
  # at nothing; a MISSING anchor is a visibly missing one, and a red job on the
  # run page is the signal. Every refusal below prints the tag name and the
  # commit so the recovery is a copyable pair of facts rather than an
  # investigation. Nothing here retries and nothing here forces, and as of fix
  # round 1 that second half is ASSERTED rather than claimed: the reviewer added
  # `--force` to the tag push and no test moved, so a test now reads every
  # ref-writing line of this job and refuses `--force`, `-f` and a `+` refspec.
  # It is the one operation that could destroy the anchor of a version that
  # really was published.
  tag:
    needs: release
    if: ${{ needs.release.outputs.publish == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 IS LOAD-BEARING FOR THE PRE-EXISTING-TAG GUARD, and the
      # earlier version of this comment did not say so. Established in fix round
      # 1 by the clean-room hazard reviewer, reading `actions/checkout@v4`'s own
      # bundled source: the all-history arm fetches `+refs/tags/*:refs/tags/*`,
      # and any POSITIVE depth takes the targeted refspec instead and brings no
      # tags at all. So at depth 1 the `git rev-parse --verify` check below
      # would still run, still pass, and see nothing, which is a guard that
      # cannot go red. The remote probe would still cover the case, and a
      # silently one-armed guard is exactly what this repository keeps paying
      # for. `test/license-gate.test.ts` asserts this value.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TAGGING COMMAND IS SHELL SO THAT A TEST CAN RUN IT, which is the
      # pattern the `decide` step above established and the reason it exists:
      # the correct number of runs of this workflow during M3-P12 is zero, so a
      # guard that is only described can only ever be described.
      # test/license-gate.test.ts extracts this body, executes it against a
      # scratch git repository with a scratch bare remote, and reads back the
      # OBJECT TYPE and the TARGET of what it produced. Keep it self-contained
      # and keep every operator-supplied value in `env:`.
      - name: Create the annotated tag at the published commit (DR-0032)
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          # `set -e` AND NOT ONLY `set -u`, which is a difference from the
          # decide step above and is deliberate: this script WRITES. A failed
          # `git push` under `set -u` alone would fall through to the closing
          # echo and exit 0, reporting a tag that is not there.
          set -eu
          declared="$(node -p 'require("./package.json").version')"
          if [ "$declared" != "$VERSION" ]; then
            echo "tag: package.json declares ${declared} and this dispatch asked for ${VERSION}." >&2
            echo "tag: refusing. A tag naming a version that was not published is the anchor pointing at nothing." >&2
            exit 1
          fi
          tag="v${declared}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag: ${tag} already exists in this checkout at $(git rev-parse "refs/tags/${tag}")." >&2
            echo "tag: refusing, and NOT moving, deleting or reusing it. Recover by hand for ${tag} at ${SHA}." >&2
            exit 1
          fi
          # THE FAILURE ARM IS WRITTEN FIRST AND ON PURPOSE. `--exit-code`
          # returns 2 for "no such ref" and 0 for "found"; ANY OTHER status is
          # an unreadable remote, and reading that as absence is a guard that
          # cannot go red. So the three cases are kept apart and the third one
          # refuses rather than assuming.
          probe=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null || probe=$?
          if [ "$probe" -eq 0 ]; then
            echo "tag: ${tag} already exists on the remote." >&2
            echo "tag: refusing, and NOT moving, deleting or reusing it. Recover by hand for ${tag} at ${SHA}." >&2
            exit 1
          fi
          if [ "$probe" -ne 2 ]; then
            echo "tag: could not read the remote's tags; git ls-remote exited ${probe}." >&2
            echo "tag: refusing rather than assuming ${tag} is absent. Recover by hand for ${tag} at ${SHA}." >&2
            exit 1
          fi
          # ANNOTATED, never lightweight: an annotated tag carries its own
          # object with an author and a date, which is what makes it a record
          # rather than a moveable label. The identity is command-scoped
          # because a CI runner has no git identity and this must never touch
          # user or global configuration.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${tag}" -m "${tag}, published to the npm registry by the release workflow" "${SHA}"
          git push origin "refs/tags/${tag}"
          echo "tag: created annotated ${tag} at ${SHA} and pushed it."

      # THE RELEASE BODY IS COMPOSED IN SHELL, FOR THE SAME REASON. The test
      # runs this body with a stub `gh` on PATH and reads the notes file back,
      # so the four things the body must carry are asserted by name against
      # what the command would actually have sent.
      #
      # `--verify-tag` is load-bearing: without it `gh release create` CREATES
      # the missing tag itself, lightweight and by its own hand, which would
      # undo the step above and hide a failed push.
      - name: Create the GitHub release, which is the owner's mental model (DR-0032)
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          declared="$(node -p 'require("./package.json").version')"
          package="$(node -p 'require("./package.json").name')"
          if [ "$declared" != "$VERSION" ]; then
            echo "release: package.json declares ${declared} and this dispatch asked for ${VERSION}." >&2
            echo "release: refusing to describe a version that was not published." >&2
            exit 1
          fi
          tag="v${declared}"
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "version: ${declared}"
            echo ""
            echo "commit: ${SHA}"
            echo ""
            echo "npm: https://www.npmjs.com/package/${package}/v/${declared}"
            echo ""
            echo "workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${notes}"
          cat "${notes}"
          gh release create "${tag}" --verify-tag --title "${tag}" --notes-file "${notes}"
